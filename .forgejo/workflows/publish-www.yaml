### Deploys to "www" sub-domain so redirects work
name: Publish-WWW
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: |
          echo "Downloading Hugo..."
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "Uncompressing Hugo..."
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "Building project..."
          ./hugo build
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://www.extralongdivision.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/

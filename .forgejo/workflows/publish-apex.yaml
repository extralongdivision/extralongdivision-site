name: Publish-Apex
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: |
          echo "Downloading Go..."
          wget -q https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "Installing Go..."
          rm -rf /usr/local/go && tar -C /usr/local -xzf go1.27.1.linux-amd64.tar.gz
          echo "Adding Go to PATH..."
          export PATH=$PATH:/usr/local/go/bin
          export PATH="$PATH:$(go env GOPATH)/bin"
          go version
          echo "Downloading Hugo..."
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "Uncompressing Hugo..."
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "Building project..."
          ./hugo build
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://extralongdivision.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/

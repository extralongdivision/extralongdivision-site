baseURL: https://extralongdivision.com/
locale: en-us
title: Extra Long Division
theme: ["PaperMod"]

enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

params:
  
  env: production
  showFullTextInRSS: true

  mainSections:
    - articles
    - projects

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: "Extra Long Division"
    icon: /favicon.ico
    iconHeight: 35

  profileMode:
    enabled: true
    subtitle: "I make things. Sometimes they work."
    imageUrl: "apple-touch-icon.png" # optional
    imageTitle: "I have a computer!" # optional
    imageWidth: 128 # custom size
    imageHeight: 128 # custom size
    buttons:
    - name: Dragon Ball Radar
      url: projects/dbz-radar/dbz-radar-devlog-1/  # FIXME WET canonicalURL
    - name: Subscribe via RSS
      url: "https://cloud.umami.is/q/OqNJhRxBC" # FIXME WET archive RSS parameter

  socialIcons: # optional
    - name: "codeberg"
      url: "https://codeberg.org/extralongdivision/"
    - name: "matrix"
      url: "https://matrix.to/#/@extralongdivision:matrix.org/"
    - name: "email"
      url: "mailto:helloworld@extralongdivision.com"
    - name: "rss"
      url: "rss/"
    - name: "kofi"
      url: "https://ko-fi.com/extralongdivision/"
    - name: "liberapay"
      url: "https://liberapay.com/extralongdivision/"
    - name: "buymeacoffee"
      url: "https://buymeacoffee.com/extralongdivision/"
  
  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
  
  # Custom variables to use everywhere
  articles_path: "articles/"
  projects_path: "projects/"
  emdash_slug: "idgaf-im-still-using-the-emdash"
  jargon_slug: "please-define-your-jargon"
  images_dir: "images/"  # in deployed directory, not in repo
  archive_rss_url: "https://cloud.umami.is/q/OqNJhRxBC" # FIXME WET RSS button
  articles_rss_url: "https://cloud.umami.is/q/duDxrD0pM"
  projects_rss_url: "https://cloud.umami.is/q/4vO3PdsPN"

menu:
  main:
    - identifier: projects
      name: Projects
      url: projects/
      weight: 1
    - identifier: articles
      name: Articles
      url: articles/
      weight: 2
    - identifier: archive
      name: Archive
      url: archive/
      weight: 3
    - identifier: RSS
      name: RSS
      url: rss/
      weight: 4
    - identifier: search
      name: Search
      url: search/
      weight: 5
